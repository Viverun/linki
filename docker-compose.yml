services:
  linki:
# image: moaljumaa/linki:latest
    # To build from source instead: comment out image above and uncomment below
    build: .
    ports:
      - "127.0.0.1:${PORT:-3456}:3000"
    volumes:
      # Persist SQLite database outside the container
      - ./data:/data
    env_file:
      - .env.local
    environment:
      # Runtime — always set by compose, do not put in .env.local
      - NODE_ENV=production
      - LINKI_DB_PATH=/data/linki.db

      # --- copy the block below into .env.local and fill in values ---
      #
      # Public URL of the app (used by NextAuth for redirects)
      # NEXTAUTH_URL=
      #
      # Random secret for NextAuth session signing
      # Generate with: openssl rand -base64 32
      # NEXTAUTH_SECRET=
      #
      # Password to log in to the Linki UI
      # AUTH_PASSWORD=
      #
      # Set to "false" to show the browser during automation (debug only)
      # HEADLESS=true

    # NOTE: `restart: unless-stopped` does NOT act on health status — Docker
    # restarts only on process exit. A failing healthcheck marks the container
    # unhealthy and nothing else happens. Acting on it needs an external
    # supervisor (an autoheal sidecar, or Swarm/Kubernetes). Until then this is
    # observability, not recovery — see docs/audit-corrections.md, F8.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json().then(b=>process.exit(b.runner&&b.runner.state==='dead'&&b.restart_will_help===true?1:0))).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    restart: unless-stopped
    labels:
      # Consumed by the autoheal sidecar below. Opt-in per container.
      - "autoheal=true"
    # Caps Linki's CPU so a busy runner can't starve other containers on a
    # small box. Raise/remove this if you have cores to spare.
    deploy:
      resources:
        limits:
          cpus: "1.5"

  # Restarts ONLY containers Docker marks unhealthy, and the probe above is
  # deliberately narrow: it fails only for a dead runner that a restart can fix.
  # With --retries=3 --interval=30s, ~90s of sustained restart-fixable death must
  # elapse first, on top of the 600s progress-marker threshold — so a restart
  # cannot land on a runner that is merely slow.
  #
  # No application dependency is added; this is a separate image with no access
  # to the app beyond the Docker socket, mounted read-only.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      # Give the app time to shut down cleanly rather than being killed mid-write.
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
